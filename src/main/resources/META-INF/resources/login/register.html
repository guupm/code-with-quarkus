<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League of Legends - 회원가입</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/download_home.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/test.js"></script>
    <script src="/js/toggle.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof showToast === 'function') {
                showToast("회원가입 페이지 로딩 완료");
            }
        });
    </script>

    <style>
        body { background-color: #0a0e17; color: #fff; font-family: 'Arial', sans-serif; }
        .navbar { background-color: #000; }
        
        /* 배경 이미지 제거 및 단색/그라데이션 테마 적용 */
        .hero { 
            background: linear-gradient(to bottom, #1e1e1e, #0a0e17); 
            min-height: 80vh; 
        }
        
        .accent-purple { color: #a020f0; }
        .accent-red { color: #ff0000; }
        .btn-primary { background-color: #a020f0; border: none; }
        .btn-primary:hover { background-color: #800080; }

        /* 라이트 모드 스타일 */
        body.light-mode { background-color: #f8f9fa; color: #333; }
        body.light-mode .hero { background: #f8f9fa; }
        body.light-mode h2, body.light-mode .form-label { color: #333; }
        body.light-mode .navbar-brand, body.light-mode .nav-link { color: #333 !important; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <img src="/image/LOL.png" alt="로고" width="30" height="24">
            
            <button class="btn border-0" id="themeToggleBtn">DARK</button>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active" href="/">리그홈</a></li>
                    <li class="nav-item"><a class="nav-link active" href="#">뉴스</a></li>
                    <li class="nav-item"><a class="nav-link active" href="#">챔피언</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/main_page_sub/download.html">다운로드</a></li>
                    <li class="nav-item"><a class="nav-link" href="/login">로그인</a></li>
                    
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            외부사이트
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                            <li><a class="dropdown-item" href="https://www.leagueoflegends.com/ko-kr/" target="_blank">롤 공식홈</a></li>
                            <li><a class="dropdown-item" href="https://lol.ps/" target="_blank">롤 전적</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="https://www.youtube.com/@LeagueofLegends-Korea" target="_blank">관련 유튜브</a></li>
                        </ul>
                    </li>
                </ul>
                <form class="d-flex" id="searchForm">
                    <input class="form-control me-2" type="search" placeholder="챔피언, 뉴스 검색..." aria-label="Search" id="searchInput">
                    <button class="btn btn-outline-success" type="submit">검색하기</button>
                </form>
            </div>
        </div>
    </nav>

    <section class="hero d-flex align-items-center justify-content-center text-center py-5">
        <div class="container" style="max-width: 480px;">
            <h2 class="fw-bold mb-4">회원가입</h2>
            <form id="registerForm" action="/register_check" method="post">
                <div class="mb-3 text-start">
                    <label class="form-label">아이디 *</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="4~20자 영문/숫자" required>
                    <div class="invalid-feedback" id="usernameMsg"></div>
                </div>

                <div class="mb-3 text-start">
                    <label class="form-label">패스워드 *</label>
                    <input type="password" class="form-control" id="password" placeholder="8자 이상, 영문+숫자+특수문자" required>
                </div>

                <div class="mb-3 text-start">
                    <label class="form-label">패스워드 확인 *</label>
                    <input type="password" class="form-control" id="passwordConfirm" placeholder="패스워드 재입력" required>
                    <div class="invalid-feedback" id="passwordMsg"></div>
                </div>

                <div class="mb-3 text-start">
                    <label class="form-label">이메일 *</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="example@email.com" required>
                    <div class="invalid-feedback" id="emailMsg"></div>
                </div>

                <div class="mb-3 text-start">
                    <label class="form-label">연락처 *</label>
                    <input type="text" class="form-control" id="phone" name="phone" placeholder="010-0000-0000" required>
                    <div class="invalid-feedback" id="phoneMsg"></div>
                </div>
                
                <input type="hidden" id="hashedPassword" name="password">

                <button type="button" class="btn btn-primary w-100" onclick="validateAndShowModal()">회원가입</button>
            </form>
        </div>
    </section>

    <div class="modal fade" id="confirmModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title">가입 확인</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>아래 정보로 가입하시겠습니까?</p>
                    <table class="table table-dark table-bordered">
                        <tr><th>아이디</th><td id="confirmUsername"></td></tr>
                        <tr><th>이메일</th><td id="confirmEmail"></td></tr>
                        <tr><th>연락처</th><td id="confirmPhone"></td></tr>
                        <tr><th>패스워드</th><td>******** (암호화 전송)</td></tr>
                    </table>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-primary" onclick="submitRegister()">가입하기</button>
                </div>
            </div>
        </div>
    </div>

    <section id="searchResults">
        <div class="search-keyword-header">
            <h1 id="searchKeywordDisplay"></h1>
        </div>
        <div class="search-body">
            <div class="container-fluid px-0">
                <div class="row g-0">
                <div class="col-md-3 col-lg-2 search-sidebar bg-white py-4">
                    <div class="px-3 mb-3" style="font-size:0.8rem; color:#999; text-transform:uppercase; letter-spacing:0.1em;">카테고리</div>
                        <div class="search-category-item active" onclick="switchCategory('champion', this)">
                            챔피언<span class="count" id="champCount">(0)</span>
                        </div>
                            <div class="search-category-item" onclick="switchCategory('news', this)">
                                뉴스<span class="count" id="newsCount">(0)</span>
                            </div>
                        </div>

                        <div class="col-md-9 col-lg-10 search-content-area">
                            <div id="resultChampion">
                                <h5 class="mb-4" style="color:#333;">챔피언</h5>
                                <div id="championResultList"></div>
                            </div>
                            <div id="resultNews" style="display:none;">
                            <h5 class="mb-4" style="color:#333;">뉴스</h5>
                            <div id="newsResultList"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:9999">
        <div id="liveToast" class="toast align-items-center text-white bg-success border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="toastBody">메시지</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <div class="modal fade" id="championModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content" id="modalContent">
                </div>
        </div>
    </div>

    <script>
    // ID를 변경한 공용 모달을 선택합니다.
    const modal = document.getElementById('championModal');

    modal.addEventListener('show.bs.modal', function (event) {
        const button = event.relatedTarget;
        
        // 버튼 없이 자바스크립트(search.js)로 강제 실행된 경우 아래 로직을 무시합니다.
        if (!button) return; 

        const url = button.getAttribute('data-url'); // 각 버튼의 data-url을 가져옴

        fetch(url)
            .then(res => {
                if (!res.ok) throw new Error("데이터를 불러오지 못했습니다.");
                return res.text();
            })
            .then(data => {
                document.getElementById("modalContent").innerHTML = data;
            })
            .catch(err => {
                console.error(err);
                document.getElementById("modalContent").innerHTML = "<div class='p-4 text-center'>상세 정보를 준비 중입니다.</div>";
            });
    });
    </script>

    <script src="/js/search.js"></script>
    <script src="/js/input_check.js"></script>
    <script src="/js/input_sha256.js"></script>

</body>
</html>
