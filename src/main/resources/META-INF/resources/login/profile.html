<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League of Legends - 메인 페이지 (프로필)</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/download_home.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/test.js"></script>
    <script src="../js/toggle.js"></script>
    
    <script>
        window.onload = function() {
            showToast('메인페이지 로딩 완료');
        }
    </script>

    <style>
        body { background-color: #0a0e17; color: #fff; font-family: 'Arial', sans-serif; }
        .navbar { background-color: #000; }
        .hero { background: linear-gradient(to bottom, #1e1e1e, #0a0e17); min-height: 60vh; }
        .accent-purple { color: #a020f0; }
        .accent-red { color: #ff0000; }
        .card { background-color: #1e1e1e; border: none; transition: transform 0.3s, box-shadow 0.3s; }
        .card:hover { transform: scale(1.05); box-shadow: 0 10px 20px rgba(160, 32, 240, 0.5); }
        .card-img-top { height: 200px; object-fit: cover; border-radius: 10px 10px 0 0; }
        .btn-primary { background-color: #a020f0; border: none; }
        .btn-primary:hover { background-color: #800080; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <img src="/image/LOL.png" alt="로고" width="30" height="24">
            
            <button class="btn border-0" id="themeToggleBtn">DARK</button>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/">리그홈</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">뉴스</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">챔피언</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/main_page_sub/after_download.html">다운로드</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/profile">👤프로필</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn btn-outline-danger btn-sm px-3" href="/logout">로그아웃</a>
                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            외부사이트
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                            <li><a class="dropdown-item" href="https://www.leagueoflegends.com/ko-kr/" target="_blank">롤 공식홈</a></li>
                            <li><a class="dropdown-item" href="https://lol.ps/" target="_blank">롤 전적</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="https://www.youtube.com/@LeagueofLegends-Korea/" target="_blank">관련 유튜브</a></li>
                        </ul>
                    </li>
                </ul>
                <form class="d-flex" id="searchForm">
                    <input class="form-control me-2" type="search" placeholder="챔피언, 뉴스 검색..." aria-label="Search" id="searchInput">
                    <button class="btn btn-outline-success" type="submit">검색하기</button>
                </form>
            </div>
        </div>
    </nav> 

    <section class="hero d-flex align-items-center justify-content-center text-center py-5">
        <div class="container" style="max-width: 500px;">
            <h2 class="fw-bold mb-4">내 프로필</h2>

            <div class="mb-4">
                <img id="profileImg" src="/uploads/profile/default.png" class="rounded-circle" width="120" height="120" style="object-fit:cover; border:3px solid #fff;" alt="프로필사진">
            </div>

            <div class="card bg-dark text-white border-secondary mb-4">
                <div class="card-body text-start">
                    <table class="table table-dark table-bordered mb-0">
                        <tr>
                            <th style="width:30%">아이디</th>
                            <td id="infoUsername"></td>
                        </tr>
                        <tr>
                            <th>이메일</th>
                            <td id="infoEmail"></td>
                        </tr>
                        <tr>
                            <th>연락처</th>
                            <td id="infoPhone"></td>
                        </tr>
                    </table>
                </div>
            </div>

            <form id="uploadForm" method="POST" action="/profile/upload" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label">프로필 사진 변경</label>
                    <input type="file" class="form-control" id="profileFile" name="profileImage" accept="image/jpeg,image/png,image/gif,image/webp" required> 
                    <div class="form-text text-muted">
                        jpg, png, gif, webp / 최대 5MB
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100">사진 업로드</button>
            </form>
            
            <hr class="my-4">
            
            <button class="btn btn-warning w-100 mb-2" type="button" data-bs-toggle="collapse" data-bs-target="#updateFormArea" aria-expanded="false">
                📂 개인정보 수정
            </button>

            <div class="collapse" id="updateFormArea">
                <div class="card card-body bg-dark text-white border-secondary mt-2">
                    
                    <div id="updateMsg" class="alert d-none mb-3"></div>
                    
                    <form id="updateForm" method="POST" action="/profile/update">
                        <div class="mb-3 text-start">
                            <label class="form-label">이메일</label>
                            <input type="text" class="form-control" id="updateEmail" name="email" placeholder="example@email.com">
                            <div class="invalid-feedback" id="updateEmailMsg"></div>
                        </div>
                        
                        <div class="mb-3 text-start">
                            <label class="form-label">연락처</label>
                            <input type="text" class="form-control" id="updatePhone" name="phone" placeholder="010-0000-0000">
                            <div class="invalid-feedback" id="updatePhoneMsg"></div>
                        </div>
                        
                        <button type="button" class="btn btn-warning w-100" onclick="validateAndUpdate()">
                            수정 완료
                        </button>

                         <hr class="my-4">
            <h5 class="fw-bold mb-3">🔒 비밀번호 변경</h5>

            <div id="pwMsg" class="alert d-none mb-3"></div>

            <form id="pwForm" method="POST" action="/profile/password">
                <div class="mb-3 text-start">
                    <label class="form-label">현재 비밀번호</label>
                    <input type="password" class="form-control" id="currentPwInput" placeholder="현재 비밀번호 입력" required>
                    <div class="invalid-feedback" id="currentPwMsg"></div>
                    <input type="hidden" id="currentPassword" name="currentPassword">
                </div>

                <div class="mb-3 text-start">
                    <label class="form-label">새 비밀번호</label>
                    <input type="password" class="form-control" id="newPwInput" placeholder="8자 이상, 영문+숫자+특수문자" required>
                    <div class="invalid-feedback" id="newPwMsg"></div>
                    <input type="hidden" id="newPassword" name="newPassword">
                </div>
                
                <div class="mb-3 text-start">
                    <label class="form-label">새 비밀번호 확인</label>
                    <input type="password" class="form-control" id="newPwConfirm" placeholder="새 비밀번호 재입력" required>
                    <div class="invalid-feedback" id="newPwConfirmMsg"></div>
                </div>

                <button type="button" class="btn btn-danger w-100" onclick="validateAndChangePassword()">
                    비밀번호 변경
                </button>
                    </form>
                </div>
            </div>

        </div>
    </section>

    <section id="searchResults">
        <div class="search-keyword-header">
            <h1 id="searchKeywordDisplay"></h1>
        </div>
        <div class="search-body">
            <div class="container-fluid px-0">
                <div class="row g-0">
                <div class="col-md-3 col-lg-2 search-sidebar bg-white py-4">
                    <div class="px-3 mb-3" style="font-size:0.8rem; color:#999; text-transform:uppercase; letter-spacing:0.1em;">카테고리</div>
                        <div class="search-category-item active" onclick="switchCategory('champion', this)">
                            챔피언<span class="count" id="champCount">(0)</span>
                        </div>
                            <div class="search-category-item" onclick="switchCategory('news', this)">
                                뉴스<span class="count" id="newsCount">(0)</span>
                            </div>
                        </div>

                        <div class="col-md-9 col-lg-10 search-content-area">
                            <div id="resultChampion">
                                <h5 class="mb-4" style="color:#333;">챔피언</h5>
                                <div id="championResultList"></div>
                            </div>
                            <div id="resultNews" style="display:none;">
                            <h5 class="mb-4" style="color:#333;">뉴스</h5>
                            <div id="newsResultList"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:9999">
        <div id="liveToast" class="toast align-items-center text-white bg-success border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="toastBody">메시지</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <div class="modal fade" id="championModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content" id="modalContent">
                </div>
        </div>
    </div>

    <script>
    // ID를 변경한 공용 모달을 선택합니다.
    const modal = document.getElementById('championModal');

    modal.addEventListener('show.bs.modal', function (event) {
        const button = event.relatedTarget;
        
        // 버튼 없이 자바스크립트(search.js)로 강제 실행된 경우 아래 로직을 무시합니다.
        if (!button) return; 

        const url = button.getAttribute('data-url'); // 각 버튼의 data-url을 가져옴

        fetch(url)
            .then(res => {
                if (!res.ok) throw new Error("데이터를 불러오지 못했습니다.");
                return res.text();
            })
            .then(data => {
                document.getElementById("modalContent").innerHTML = data;
            })
            .catch(err => {
                console.error(err);
                document.getElementById("modalContent").innerHTML = "<div class='p-4 text-center'>상세 정보를 준비 중입니다.</div>";
            });
    });
    </script>
    
    <script src="../js/search.js"></script>
    <script src="../js/Profile.js"></script>

</body> 
</html>
